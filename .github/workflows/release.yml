name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
      - run: uv sync --locked --all-extras --dev
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - run: uv run --locked pytest
      - run: uv build --out-dir .tmp/dist
      - name: Verify release tag and package
        shell: pwsh
        run: |
          $packageVersion = uv run --locked python -c "from importlib.metadata import version; print(version('farm-merge-valet'))"
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") { throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion" }
          uv run --locked python -m zipfile --list (Get-ChildItem .tmp/dist/*.whl).FullName
          uv run --locked python -m farm_merge_valet --help
          uv run --locked python -c "import farm_merge_valet.gui.application"
          uv run --locked farm-merge-valet --help
          if ((uv run --locked python -c "import farm_merge_valet; print(farm_merge_valet.__version__)") -ne $packageVersion) { throw "Displayed version mismatch" }
      - name: Build desktop executable
        run: uv run --locked pyinstaller --clean --noconfirm --onefile --windowed --name farm-merge-valet --workpath .tmp/pyinstaller/work --specpath .tmp/pyinstaller/spec --distpath .tmp/dist src/farm_merge_valet/__main__.py
      - uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.3
        with:
          name: farm-merge-valet-release
          path: |
            .tmp/dist/*
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: .tmp/dist/*
