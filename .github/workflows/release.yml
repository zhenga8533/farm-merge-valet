name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,package]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - run: python -m build
      - name: Build desktop executable
        run: pyinstaller --clean --noconfirm --onefile --windowed --name farm-merge-valet src/farm_merge_valet/__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: farm-merge-valet-release
          path: |
            dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
