[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farm-merge-valet"
version = "0.1.0"
description = "Internal-API automation tool for Farm Merge Valley"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Allen Zheng" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "keyboard>=0.13",
    "pydantic>=2.7",
    "httpx>=0.27",
    "websockets>=12.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
]
package = [
    "build>=1.2",
    "pyinstaller>=6.10",
]

[project.scripts]
farm-merge-valet = "farm_merge_valet.cli:app"

[project.gui-scripts]
farm-merge-valet-gui = "farm_merge_valet.gui.application:run_application"

[tool.hatch.build.targets.wheel]
packages = ["src/farm_merge_valet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".tmp/pytest-cache"
addopts = "--basetemp=.tmp/pytest"

[tool.coverage.run]
data_file = ".tmp/coverage/.coverage"

[tool.coverage.html]
directory = ".tmp/coverage/html"

[tool.coverage.xml]
output = ".tmp/coverage/coverage.xml"
