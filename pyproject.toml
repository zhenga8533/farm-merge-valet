[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farm-merge-valet"
version = "0.1.0"
description = "Screen-automation tool for Farm Merge Valley"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Allen Zheng" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "mss>=9.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9; sys_platform == 'win32'",
    "keyboard>=0.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
farm-merge-valet = "farm_merge_valet.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/farm_merge_valet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
